<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Flask Inventory{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <nav class="nav shell-wide" aria-label="Main navigation">
      <a class="brand" href="{{ url_for('home') }}">Flask Inventory</a>
      <div class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('contact') }}">Contact</a>
      </div>
    </nav>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
