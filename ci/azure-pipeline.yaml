parameters:
- name: azureAgentpool
  displayName: azure-agent-pool
  type: string
  default: azure-vm-pool
  values:
  - azure-vm-pool
  - azure-prod-vm-pool
  - default-pool

- name: imageTag
  displayName: Docker Image Build 
  type: string
  default: v3.0.0

- name: SonarAnalysis
  displayName: Run SonarQube Analysis
  type: boolean
  default: true

- name: ArtifactsUpload
  displayName: Run Artifacts Building
  type: boolean
  default: true

trigger: none

variables:
- name: agentPoolName
  value: ${{ parameters.azureAgentpool }}
- name:  imageRepo
  value: 'apps'
- name:  dockerRegistryServiceConnection
  value: 'ecrapp-sc'
- name:  acrLoginServer
  value: 'ecrapp.azurecr.io'
- name:  acrLoginName
  value: 'ecrapp'
- name:  resourceGroup
  value: 'app-env-setup'

pool: 
  name: $(agentPoolName)

steps:
- checkout: self 
  displayName: 'Appcode Checkout' 


- task: Maven@4
  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: 'default'
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    testResultsFiles: '**/TEST-*.xml'
    goals: 'package'
  displayName: 'Maven Builds'   

- ${{ if eq(parameters.SonarAnalysis, true) }}:
  - task: SonarQubePrepare@7
    inputs:
      SonarQube: 'sonar-azure-connection' # This assumes you've set up a service connection named 'SonarQube'
      scannerMode: 'CLI'
      configMode: 'manual'
      cliProjectKey: 'azure-devops-javaapp'
      cliProjectName: 'azure-devops-javaapp'


  # Place immediately after SonarQubePrepare@7
  - bash: |
      python3 - <<'PY'
      import json
      import os

      raw = os.environ.get("SONARQUBE_SCANNER_PARAMS", "{}")
      params = json.loads(raw)

      removed = params.pop("sonar.branch.name", None)
      print("Removed automatically injected branch property:", removed is not None)

      value = json.dumps(params, separators=(",", ":"))
      value = (value.replace("%", "%AZP25")
                    .replace("\r", "%0D")
                    .replace("\n", "%0A")
                    .replace("]", "%5D")
                    .replace(";", "%3B"))

      print("##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]" + value)
      PY
    displayName: 'Remove unsupported SonarQube branch property'
    
  - task: SonarQubeAnalyze@7
    displayName: 'Run SonarQube Analysis'

  
  - task: SonarQubePublish@7
    inputs:
      pollingTimeoutSec: '300'
    displayName: 'Publish SonarQube Analysis Results Quality Gate'

- ${{ if eq(parameters.SonarAnalysis, false) }}:
  - script: echo "SonarQube Analysis skipped Due to Boolen is false"
    displayName: Skip SonarQubeAnalys

# Maven artifact upload to Azure Artifacts
- ${{ if eq(parameters.ArtifactsUpload, true) }}:
  - task: MavenAuthenticate@0
    displayName: 'Maven Feed Authentication'
    inputs:
      artifactsFeeds: 'prateekkumawat20/pyflask'

  - task: Maven@4
    displayName: 'Upload Maven Artifact to Azure Artifacts'
    inputs:
      mavenPomFile: 'pom.xml'
      mavenOptions: '-Xmx3072m'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: 'default'
      jdkArchitectureOption: 'x64'
      publishJUnitResults: false
      mavenVersionOption: 'Default'
      goals: 'deploy'
      options: '-DskipTests'

- ${{ if eq(parameters.ArtifactsUpload, false) }}:
  - script: echo "ArtifiactsUpload skipped Due to Boolen is false, No feed availabel for this Builds "
    displayName: Skip Artifacts Upload

- script:  |
    echo "Build container Images"
    az acr login -n $(acrLoginName) -u "$(ACR_USERNAME)" -p "$(ACR_PASSWORD)"
    docker build -t $(acrLoginServer)/apps:${{ parameters.imageTag }} .
    docker push $(acrLoginServer)/apps:${{ parameters.imageTag }}

    echo "Image Push in acr repo"   
  displayName: ContainerImageBuild