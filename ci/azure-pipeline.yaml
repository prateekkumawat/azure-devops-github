trigger: 
  - main 

pool: 
  name: azure-vm-pool

steps:
- checkout: self
  displayName: 'Appcode Checkout' 

- script: | 
    pip install --upgrade pip
    pip install -r requirement.txt
    pip install twine keyring artifacts-keyring
    pip install build
  displayName: 'Install application dependecies'

- script: |
    echo "start python app build"    
    python3 setup.py sdist bdist_wheel
  displayName: 'python App Build'

- task: SonarQubePrepare@7
  inputs:
    SonarQube: 'sonar-azure-connection' # This assumes you've set up a service connection named 'SonarQube'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: 'azure-devops-github'
    cliProjectName: 'azure-devops-github'

- task: SonarQubePublish@7
  inputs:
    pollingTimeoutSec: '300'
  displayName: 'Publish SonarQube Analysis Results Quality Gate'

- task: TwineAuthenticate@1
  inputs:
    artifactFeed: prateekkumawat20/pyflask                ## For an organization-scoped feed, use: artifactFeed: <FEED_NAME>
  displayName: 'Twine Authenticate'

- script: |
    python3 -m twine upload -r pyflask --config-file $(PYPIRC_PATH) dist/*.whl
  displayName: 'Upload to feed'

